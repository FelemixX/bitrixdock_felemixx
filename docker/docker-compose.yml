services:
  php:
    build: ./php/${PHP_VERSION}
    volumes:
      - ${SITE_PATH}:/var/www/bitrix
      - ./logs/php:/var/log/php
      - /etc/localtime:/etc/localtime/:ro
    environment:
      TZ: Europe/Moscow
    networks:
      - bitrixdock
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    extra_hosts:
      - "bitrix.local:172.19.0.9"

  web_server:
    build: ./${WEB_SERVER_TYPE}
    volumes:
      - ${SITE_PATH}:/var/www/bitrix
      - ./logs/${WEB_SERVER_TYPE}:/var/log/${WEB_SERVER_TYPE}
      - /etc/localtime:/etc/localtime/:ro
    ports:
      - '${INTERFACE}:80:80'
      - '${INTERFACE}:443:443'
    networks:
      bitrixdock:
        ipv4_address: 172.19.0.9
    environment:
      TZ: Europe/Moscow
    restart: unless-stopped
    links:
      - php
    depends_on:
      - php
    extra_hosts:
      - "push-server-sub:172.19.0.10"
      - "push-server-pub:172.19.0.11"

  db:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION:-8.4}
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./logs/db:/var/log/mysql
      - /etc/localtime:/etc/localtime/:ro
      - db:/var/lib/mysql
    ports:
      - '${INTERFACE}:3306:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/Moscow
    networks:
      - bitrixdock
    restart: unless-stopped

  memcached:
    image: memcached:latest
    networks:
      - bitrixdock
    environment:
      TZ: Europe/Moscow
    restart: unless-stopped

  push-server-sub:
    image: ikarpovich/bitrix-push-server
    networks:
      bitrixdock:
        ipv4_address: 172.19.0.10
    environment:
      - REDIS_HOST=redis
      - LISTEN_HOSTNAME=0.0.0.0
      - LISTEN_PORT=8010
      - SECURITY_KEY=testtesttest
      - MODE=sub
    depends_on:
      - redis
    profiles:
      - push

  push-server-pub:
    image: ikarpovich/bitrix-push-server
    networks:
      bitrixdock:
        ipv4_address: 172.19.0.11
    environment:
      - REDIS_HOST=redis
      - LISTEN_HOSTNAME=0.0.0.0
      - LISTEN_PORT=8010
      - SECURITY_KEY=testtesttest
      - MODE=pub
    depends_on:
      - redis
    profiles:
      - push

  redis:
    image: redis
    networks:
      - bitrixdock
    profiles:
      - push

  mailpit:
    image: axllent/mailpit
    restart: on-failure
    ports:
      - '${INTERFACE}:1025:1025'
      - '${INTERFACE}:8025:8025'
    networks:
      - bitrixdock
    volumes:
      - ${SITE_PATH}:/var/www/bitrix
      - ./logs/mailpit:/var/log/mailpit
      - mailpit:/data
    environment:
      TZ: Europe/Moscow
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SENDMAIL_SMTP_ADDR: mailpit:1025
      MP_LOG_FILE: /var/log/mailpit/error.log
      MP_QUIET: true

  xhprof-viewer:
    build: ./xhprof-viewer
    restart: on-failure
    networks:
      - bitrixdock
    volumes:
      - ${SITE_PATH}:/var/www/bitrix
      - ./xhprof-viewer/viewer:/var/www/html/
      - ./logs/xhprof:/var/log/xhprof
    ports:
      - ${XHPROF_VIEWER_PORT}:80

volumes:
  db:
    driver: local
  mailpit:
    driver: local

networks:
  bitrixdock:
    ipam:
      config:
        - subnet: 172.19.0.0/24
