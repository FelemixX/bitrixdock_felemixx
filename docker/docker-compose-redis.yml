x-base-service: &base-service
  volumes:
    - ${SITE_PATH}:/var/www/bitrix
    - ./logs/${WEB_SERVER_TYPE}:/var/log/${WEB_SERVER_TYPE}
    - ./logs/php:/var/log/php
    - ./logs/db:/var/log/mysql
    - ./logs/redis:/var/log/redis
    - ./logs/mailpit:/var/log/mailpit
    - ./logs/xhprof:/var/log/xhprof
    - db:/var/lib/mysql
    - cache:/var/lib/redis
    - mailpit:/data
    - /etc/localtime:/etc/localtime:ro

volumes:
  db:
    driver: local
  cache:
    driver: local
  mailpit:
    driver: local

networks:
  bitrixdock:

services:
  php:
    <<: *base-service
    build: ./php/${PHP_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_php
    links:
      - db
      - redis
    environment:
      - TZ=Europe/Moscow
    stdin_open: true
    tty: true
    networks:
      - bitrixdock
    restart: always

  web_server:
    <<: *base-service
    build: ./${WEB_SERVER_TYPE}
    container_name: ${COMPOSE_PROJECT_NAME}_web_server
    depends_on:
      - php
    ports:
      - '${INTERFACE}:80:80'
      - '${INTERFACE}:443:443'
    links:
      - php
    environment:
      - TZ=Europe/Moscow
    stdin_open: true
    tty: true
    networks:
      - bitrixdock
    restart: always

  db:
    <<: *base-service
    build: ./${DB_SERVER_TYPE}
    container_name: ${COMPOSE_PROJECT_NAME}_db
    volumes:
      - ./${DB_SERVER_TYPE}/init:/docker-entrypoint-initdb.d
    ports:
      - '${INTERFACE}:3306:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Europe/Moscow
    command: mysqld --user=root --sql-mode=""
    stdin_open: true
    tty: true
    networks:
      - bitrixdock
    restart: always

  redis:
    <<: *base-service
    image: redis:latest
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    ports:
      - '${INTERFACE}:6379:6379'
    networks:
      - bitrixdock
    environment:
      - TZ=Europe/Moscow
    stdin_open: true
    tty: true
    restart: on-failure

  mailpit:
    <<: *base-service
    image: axllent/mailpit
    container_name: ${COMPOSE_PROJECT_NAME}_mailpit
    ports:
      - '${INTERFACE}:1025:1025'
      - '${INTERFACE}:8025:8025'
    environment:
      TZ: Europe/Moscow
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SENDMAIL_SMTP_ADDR: mailpit:1025
      MP_LOG_FILE: /var/log/mailpit/error.log
      MP_QUIET: true
    networks:
      - bitrixdock
    restart: always

  xhprof-viewer:
    <<: *base-service
    build: ./xhprof-viewer
    container_name: ${COMPOSE_PROJECT_NAME}_xhprof-viewer
    ports:
      - ${XHPROF_VIEWER_PORT}:80
    volumes:
      - ./xhprof-viewer/viewer:/var/www/html/
      - ./logs/xhprof:/var/log/xhprof
    networks:
      - bitrixdock
    restart: always
